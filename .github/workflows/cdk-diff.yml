name: CDK Diff (PR)

# NOTE: no `paths:` filter here. This check is required by branch
# protection on main, so it must run (and report a status) for every PR,
# not just ones touching infra/ — otherwise GitHub blocks merges forever
# waiting on a status that never gets reported. Instead, the job always
# runs but skips the actual `cdk diff` work when no infra files changed.
on:
  pull_request:

permissions:
  id-token: write       # Required for OIDC token exchange
  contents: read
  pull-requests: write  # Required to post diff as PR comment

jobs:
  cdk-diff:
    name: CDK Infrastructure Diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for infra changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(infra/|\.github/workflows/cdk-diff\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: npm ci

      - name: Build CDK app
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        if: steps.changes.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDK_DIFF_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run CDK diff
        if: steps.changes.outputs.run == 'true'
        id: cdk-diff
        working-directory: infra
        run: |
          # Capture diff output; exit 0 even if there are changes (exit 1 = changes, 2 = error)
          DIFF_OUTPUT=$(npx cdk diff 2>&1 || true)
          echo "diff_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post CDK diff as PR comment
        if: steps.changes.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          DIFF_OUTPUT: ${{ steps.cdk-diff.outputs.diff_output }}
        with:
          script: |
            const diff = process.env.DIFF_OUTPUT;
            const body = [
              '## CDK Infrastructure Diff',
              '',
              'The following infrastructure changes are proposed by this PR:',
              '',
              '```',
              diff,
              '```',
              '',
              '_Review carefully before merging. This diff is generated by `cdk diff` against the currently deployed stack._',
            ].join('\n');

            // Find existing comment and update, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## CDK Infrastructure Diff')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
