name: CDK Diff (PR)

# NOTE: no `paths:` filter here. This check is required by branch
# protection on main, so it must run (and report a status) for every PR,
# not just ones touching infra/ — otherwise GitHub blocks merges forever
# waiting on a status that never gets reported. Instead, the job always
# runs but skips the actual `cdk diff` work when no infra files changed.
on:
  pull_request:

permissions:
  id-token: write       # Required for OIDC token exchange
  contents: read
  pull-requests: write  # Required to post diff as PR comment

jobs:
  cdk-diff:
    name: CDK Infrastructure Diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for infra changes
        id: changes
        # Also force run=false for Dependabot-authored PRs, even if they
        # touch infra/ (e.g. an infra/package.json dependency bump) or
        # this workflow file itself (an actions/* version bump). GitHub
        # strips secrets and OIDC token permissions from pull_request runs
        # triggered by dependabot[bot] as an anti-exfiltration measure —
        # see https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions#investigating-failed-workflow-runs
        # ("secrets are available in Dependabot secrets rather than as
        # GitHub Actions secrets"). configure-aws-credentials can
        # therefore never authenticate on these runs, so attempting the
        # actual `cdk diff` would always fail this required check. A
        # dependency/action-version bump alone doesn't produce
        # CloudFormation drift, so skipping is safe here — the PR diff
        # (just version pins) is still human-reviewed before merge.
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(infra/|\.github/workflows/cdk-diff\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: npm ci

      - name: Audit dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        # Gated at 'critical' rather than 'high' for now: the existing
        # high/moderate findings are all bundled transitive deps inside
        # aws-cdk-lib itself (ajv/minimatch/yaml/brace-expansion), only
        # fixable by an aws-cdk-lib major-version bump — tracked separately
        # in task.md ("Un-pin / upgrade aws-cdk"), pending a feature-flag
        # compat review. Tighten back to 'high' once that lands.
        run: npm audit --audit-level=critical

      - name: Build CDK app
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        if: steps.changes.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDK_DIFF_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run CDK diff
        if: steps.changes.outputs.run == 'true'
        id: cdk-diff
        working-directory: infra
        env:
          OTP_ADMIN_EMAIL: ${{ secrets.OTP_ADMIN_EMAIL }}
          OTP_SES_FROM_ADDRESS: ${{ secrets.OTP_SES_FROM_ADDRESS }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET }}
        run: |
          # Capture diff output; exit 0 even if there are changes (exit 1 = changes, 2 = error)
          DIFF_OUTPUT=$(npx cdk diff 2>&1 || true)
          echo "diff_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post CDK diff as PR comment
        if: steps.changes.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          DIFF_OUTPUT: ${{ steps.cdk-diff.outputs.diff_output }}
        with:
          script: |
            const diff = process.env.DIFF_OUTPUT;
            const body = [
              '## CDK Infrastructure Diff',
              '',
              'The following infrastructure changes are proposed by this PR:',
              '',
              '```',
              diff,
              '```',
              '',
              '_Review carefully before merging. This diff is generated by `cdk diff` against the currently deployed stack._',
            ].join('\n');

            // Find existing comment and update, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## CDK Infrastructure Diff')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
