name: CDK Diff (PR)

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/cdk-diff.yml'

permissions:
  id-token: write       # Required for OIDC token exchange
  contents: read
  pull-requests: write  # Required to post diff as PR comment

jobs:
  cdk-diff:
    name: CDK Infrastructure Diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Build CDK app
        working-directory: infra
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run CDK diff
        id: cdk-diff
        working-directory: infra
        run: |
          # Capture diff output; exit 0 even if there are changes (exit 1 = changes, 2 = error)
          DIFF_OUTPUT=$(npx cdk diff 2>&1 || true)
          echo "diff_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post CDK diff as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const diff = `${{ steps.cdk-diff.outputs.diff_output }}`;
            const body = [
              '## CDK Infrastructure Diff',
              '',
              'The following infrastructure changes are proposed by this PR:',
              '',
              '```',
              diff,
              '```',
              '',
              '_Review carefully before merging. This diff is generated by `cdk diff` against the currently deployed stack._',
            ].join('\n');

            // Find existing comment and update, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## CDK Infrastructure Diff')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
