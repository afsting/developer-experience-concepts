name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Audit dependencies
        working-directory: infra
        # See cdk-diff.yml's matching step for why this is 'critical' and
        # not 'high' for now.
        run: npm audit --audit-level=critical

      - name: Build CDK app
        working-directory: infra
        run: npm run build

      - name: Run CDK tests
        working-directory: infra
        run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          # OIDC federation — no long-lived AWS keys are stored as secrets.
          # GitHub presents a short-lived OIDC token; AWS STS validates it
          # and issues temporary credentials scoped to this role only.

      - name: CDK deploy
        working-directory: infra
        env:
          OTP_ADMIN_EMAIL: ${{ secrets.OTP_ADMIN_EMAIL }}
          OTP_SES_FROM_ADDRESS: ${{ secrets.OTP_SES_FROM_ADDRESS }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET }}
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Extract CDK outputs
        working-directory: infra
        id: cdk-outputs
        run: |
          BUCKET_NAME=$(jq -r '.ResumeSiteStack.BucketName' cdk-outputs.json)
          DISTRIBUTION_ID=$(jq -r '.ResumeSiteStack.DistributionId' cdk-outputs.json)
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Sync site to S3
        run: |
          # Sync HTML files with no-cache headers
          aws s3 sync site/ "s3://${{ steps.cdk-outputs.outputs.bucket_name }}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

          # Sync static assets with long-lived cache headers.
          # dora-metrics.json / security-scorecard.json are excluded from
          # both syncs — they're owned exclusively by their own scheduled
          # workflows (dora-metrics.yml / security-scorecard.yml), which
          # write directly to S3. Without this exclude, --delete here
          # would remove them (they're git-untracked, so absent from this
          # checkout) the next time this workflow runs.
          aws s3 sync site/ "s3://${{ steps.cdk-outputs.outputs.bucket_name }}/" \
            --exclude "*.html" \
            --exclude "dora-metrics.json" \
            --exclude "security-scorecard.json" \
            --cache-control "max-age=31536000, immutable" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cdk-outputs.outputs.distribution_id }}" \
            --paths "/*"
